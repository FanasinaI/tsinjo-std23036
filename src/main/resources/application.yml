spring:
  application:
    name: tsinjo-std23036

  profiles:
    active: ${ENV:preprod}
    group:
      preprod: flyway

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tsinjo}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:fanasina}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    table: schema_version
    connect-retries: 3

vola:
  api:
    key: ${VOLA_API_KEY:}
    base-url: ${VOLA_API_BASE_URL:https://api.vola.mg}
    timeout-ms: ${VOLA_API_TIMEOUT:5000}

logging:
  level:
    root: WARN
    school.hei.tsinjo: INFO
    org.springframework: WARN
    org.hibernate.SQL: ${LOG_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: preprod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tsinjo_preprod}
    hikari:
      maximum-pool-size: 5
  flyway:
    locations: classpath:db/migration,classpath:db/testdata

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 15
      connection-timeout: 10000
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    locations: classpath:db/migration
    baseline-version: 1.0